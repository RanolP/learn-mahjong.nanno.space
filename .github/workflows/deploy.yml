name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 배포 잡이 Pages 에 쓰려면 이 세 권한이 모두 필요하다. id-token 은
# actions/deploy-pages 가 OIDC 로 배포 권한을 받는 데 쓴다.
permissions:
  contents: read
  pages: write
  id-token: write

# 연달아 푸시했을 때 앞선 배포를 취소하지 않고 순서대로 끝낸다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm test

      - run: pnpm build

      # 정적 호스팅에는 404.html 하나만 있으면 되는데, 프리렌더는 경로마다
      # 폴더와 index.html 을 만든다. Pages 가 찾는 이름으로 한 벌 더 둔다.
      - run: cp .output/public/404/index.html .output/public/404.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
